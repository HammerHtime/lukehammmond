# Runs the safety net on every push and every pull request.
#
# Until now the suite only ran when somebody remembered to run it. Everything
# in this repository is pushed straight to a live site that college coaches
# read, so "it was green on my machine" is the wrong standard.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The suite needs no dependencies. It runs on the seed data in
      # public/swimmer.js, so there is nothing to install and nothing to cache.
      - name: Lint and test
        run: npm run check
