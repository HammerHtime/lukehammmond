<!--
  A different visual language for the same facts.

  Every swimmer profile on the internet is built like a personal brand page: a
  hero photo, a big name, a story. Luke's content is not a story. It is
  evidence, ie, times, ranks, deltas and splits, and evidence wants a results
  board rather than a portfolio.

  So this reads like a timing console. Dense, aligned, monospaced numerals,
  hairlines instead of cards, and one accent that means one thing.

  What does NOT change: every number is read from the same modules the live
  site reads. Nothing here is typed.
-->

:root {
  /* Deep water, not "dark tech". Off-black rather than #000. */
  --ink:#070c12; --ink-2:#0c141d; --rule:#1b2836; --rule-soft:#121c26;
  --paper:#eef3f7; --mute:#7c8fa3; --dim:#6c8092; /* was #4e6274, 3.1:1, too faint for captions. Lifted 1 Oct 2026. */

  /* Two accents with two jobs, which is the whole colour system.
     GOLD is only ever Luke's own number. AQUA is only ever structure and
     labels. The old page used aqua for everything, which is what made it read
     as generic dark-tech. */
  --his:#f0b429;
  --chrome:#3ea6c8;

  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo",system-ui,-apple-system,sans-serif;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
section, header { scroll-margin-top:72px; }
body {
  margin:0; background:var(--ink); color:var(--paper);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:1180px; margin:0 auto; padding:0 28px; }
@media (max-width:640px){ .wrap { padding:0 18px; } }

/* ---------- nav: one line, 64px ---------- */
nav {
  position:sticky; top:0; z-index:20; height:64px;
  background:color-mix(in srgb, var(--ink) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--rule);
}
nav .wrap { height:100%; display:flex; align-items:center; justify-content:space-between; gap:20px; }
.mark { font-weight:700; font-stretch:112%; letter-spacing:-.01em; font-size:15px; }
.mark span { color:var(--mute); font-weight:400; }
nav ul { display:flex; gap:26px; list-style:none; margin:0; padding:0; }
nav a { color:var(--mute); text-decoration:none; font-size:13px; font-weight:500; }
nav a:hover, nav a:focus-visible { color:var(--paper); }
/* On a phone the section list is noise, but a nav with nothing in it is worse.
   Keep the one link a coach actually wants. */
@media (max-width:760px){
  nav ul { gap:0; }
  nav li:not(:last-child) { display:none; }
  nav a { color:var(--chrome); }
}

/* ---------- hero: the claim, not the name ---------- */
.hero { padding:88px 0 64px; border-bottom:1px solid var(--rule); }
.hero-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:56px; align-items:end; }
@media (max-width:860px){
  .hero-grid { grid-template-columns:1fr; gap:32px; align-items:start; }
  .hero { padding:40px 0 48px; }
}

.eyebrow {
  font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--chrome); margin:0 0 20px;
}
.claim {
  font-family:var(--mono); font-weight:700; letter-spacing:-.04em;
  font-size:clamp(68px,13vw,152px); line-height:.86; color:var(--his);
  font-variant-numeric:tabular-nums; margin:0;
}
.claim-what {
  font-size:clamp(20px,2.6vw,30px); font-weight:600; font-stretch:112%;
  letter-spacing:-.02em; margin:18px 0 0; line-height:1.15;
}
.claim-what b { color:var(--chrome); font-weight:600; }
.claim-when {
  font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--dim); margin:10px 0 0;
}
.hero-who { font-size:15px; color:var(--mute); margin:14px 0 0; max-width:42ch; }
.hero-cta { display:flex; gap:12px; margin-top:30px; flex-wrap:wrap; }
.btn {
  font-family:var(--sans); font-size:14px; font-weight:600; letter-spacing:.01em;
  padding:12px 20px; border-radius:2px; text-decoration:none; display:inline-block;
  border:1px solid transparent; transition:transform .12s, background .12s, border-color .12s;
}
.btn:active { transform:translateY(1px); }
.btn-1 { background:var(--his); color:#231800; }
.btn-1:hover { background:#ffc73f; }
.btn-2 { border-color:var(--rule); color:var(--paper); }
.btn-2:hover { border-color:var(--chrome); }

/* The portrait sits in the hero as evidence, not as decoration. */
.hero-shot { position:relative; }
.hero-shot img {
  width:100%; aspect-ratio:4/5; object-fit:cover; object-position:42% 50%;
  display:block; filter:grayscale(.35) contrast(1.06);
  border:1px solid var(--rule);
}
@media (max-width:860px){ .hero-shot img { aspect-ratio:4/3; } }
.hero-shot figcaption {
  font-family:var(--mono); font-size:11px; color:var(--dim);
  margin-top:10px; letter-spacing:.04em;
}

/* ---------- the board: dense, aligned, no cards ---------- */
section { padding:72px 0; border-bottom:1px solid var(--rule); }
h2 {
  font-size:clamp(26px,3.4vw,40px); font-weight:700; font-stretch:112%;
  letter-spacing:-.025em; margin:0 0 6px; line-height:1.05;
}
.lede { color:var(--mute); font-size:15px; margin:0 0 34px; max-width:62ch; }

.board { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
.board th {
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim); font-weight:500; text-align:left; padding:0 0 12px; border-bottom:1px solid var(--rule);
}
.board th.n, .board td.n { text-align:right; }
.board td { padding:15px 0; border-bottom:1px solid var(--rule-soft); vertical-align:baseline; }
.board tr:hover td { background:var(--ink-2); }
.ev { font-weight:600; font-size:16px; letter-spacing:-.01em; }
.ev small { display:block; font-family:var(--mono); font-size:10.5px; color:var(--dim);
  letter-spacing:.1em; text-transform:uppercase; margin-top:3px; font-weight:400; }
.t { font-family:var(--mono); font-size:22px; font-weight:500; letter-spacing:-.02em; }
.t.lead { color:var(--his); font-weight:700; }
.y { font-family:var(--mono); font-size:15px; color:var(--mute); }
.rk { font-family:var(--mono); font-size:13px; color:var(--chrome); font-weight:500; white-space:nowrap; }
.drop { font-family:var(--mono); font-size:13px; color:var(--his); }

/* ---------- ranked: the published list, in rank order ---------- */
.ranks { margin-top:52px; }
.ranks h3 { font-size:clamp(20px,2.4vw,26px); font-weight:700; font-stretch:112%;
  letter-spacing:-.02em; margin:0 0 4px; }
.rank-list { list-style:none; margin:18px 0 0; padding:0; border-top:1px solid var(--rule);
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:48px; }
@media (max-width:760px){ .rank-list { grid-template-columns:1fr; } }
.rank-list li { display:grid; grid-template-columns:56px minmax(0,1fr) auto; align-items:baseline;
  gap:12px; padding:12px 0; border-bottom:1px solid var(--rule-soft); font-variant-numeric:tabular-nums; }
.rl-rank { font-family:var(--mono); font-size:18px; font-weight:700; color:var(--chrome); }
.rl-ev { font-weight:600; font-size:15px; }
.rl-t { font-family:var(--mono); font-size:15px; color:var(--his); }
.rank-src { font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.04em;
  margin:14px 0 0; max-width:80ch; line-height:1.6; }
@media (max-width:760px){
  .board .hide-sm { display:none; }
  .t { font-size:19px; }
}

/* ---------- the drop: the line is the argument ---------- */
.curve-grid { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:48px; align-items:start; }
@media (max-width:900px){ .curve-grid { grid-template-columns:1fr; gap:28px; } }
.curve { width:100%; height:auto; display:block; overflow:visible; }
.curve .axis { stroke:var(--rule); stroke-width:1; }
.curve .path { fill:none; stroke:var(--his); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.curve .dot { fill:var(--ink); stroke:var(--his); stroke-width:2.5; }
.curve .cut { stroke:var(--chrome); stroke-width:1.5; stroke-dasharray:5 5; opacity:.75; }
.curve text { font-family:var(--mono); font-size:11px; fill:var(--dim); }
.curve text.val { fill:var(--paper); font-size:12.5px; font-weight:500; }
.curve text.cutlabel { fill:var(--chrome); font-size:10.5px; letter-spacing:.08em; }

@media (prefers-reduced-motion: no-preference) {
  .js .curve .path { stroke-dasharray:var(--len); stroke-dashoffset:var(--len); }
  .js .curve.on .path { animation:draw 1500ms cubic-bezier(.16,1,.3,1) forwards; }
  .js .curve .dot, .js .curve text.val { opacity:0; }
  .js .curve.on .dot { animation:pop 320ms ease forwards; animation-delay:calc(var(--i) * 300ms + 260ms); }
  .js .curve.on text.val { animation:pop 320ms ease forwards; animation-delay:calc(var(--i) * 300ms + 400ms); }
}
@keyframes draw { to { stroke-dashoffset:0; } }
@keyframes pop { to { opacity:1; } }

.tally { border-top:1px solid var(--rule); }
.tally div { padding:16px 0; border-bottom:1px solid var(--rule-soft); }
.tally dt { font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
.tally dd { margin:5px 0 0; font-family:var(--mono); font-size:26px; font-weight:700;
  letter-spacing:-.03em; color:var(--his); font-variant-numeric:tabular-nums; }
.tally dd small { display:block; font-family:var(--sans); font-size:13px; font-weight:400;
  color:var(--mute); letter-spacing:0; margin-top:4px; }

/* ---------- the note ---------- */
.note { display:grid; grid-template-columns:1fr 1fr; gap:44px; }
@media (max-width:760px){ .note { grid-template-columns:1fr; gap:28px; } }
.note p { color:var(--mute); font-size:15px; margin:0 0 14px; max-width:60ch; }
.note p strong { color:var(--paper); font-weight:600; }
.note-shot { margin:22px 0 0; }
.note-shot img {
  width:100%; aspect-ratio:3/2; object-fit:cover; display:block;
  filter:grayscale(.35) contrast(1.06); border:1px solid var(--rule);
}
.note-shot figcaption {
  font-family:var(--mono); font-size:11px; color:var(--dim);
  margin-top:10px; letter-spacing:.04em;
}
.kv { border-top:1px solid var(--rule); }
.kv div { display:flex; justify-content:space-between; gap:18px; padding:13px 0;
  border-bottom:1px solid var(--rule-soft); font-size:14.5px; }
.kv dt { color:var(--dim); }
.kv dd { margin:0; text-align:right; }
.kv dd a { color:var(--chrome); text-decoration:none; }
.kv dd a:hover { text-decoration:underline; }

footer { padding:38px 0 56px; }
.foot { display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;
  font-family:var(--mono); font-size:11.5px; color:var(--dim); letter-spacing:.04em; }
</style>
<script>document.documentElement.classList.add('js');</script>

  <div class="wrap">
    <div class="mark">Luke Hammond <span>/ 2029</span></div>

    </ul>

<header class="hero">

<section id="reach" style="border-bottom:none">

  </div>
</section>

<footer>

    <span id="foot-2"></span>
  </div>
</footer>
