[build]
  publish = "."
  functions = "netlify/functions"

# The back end, the project's own notes, and the test file are not the website.
# The publish root is the whole folder, so anything not explicitly hidden is
# served to anyone who guesses the path.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/board.test.js"
  to = "/404.html"
  status = 404
  force = true

# schools.js is deliberately NOT blocked. The admin screen needs its importer,
# and the seed list carries no contacts, ie, every email in the file is empty.
# Confirmed coach addresses live in storage behind the admin key and are served
# only by the schools function. Blocking the file would break the importer
# without protecting anything.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
