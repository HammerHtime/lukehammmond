[build]
  publish = "public"
  functions = "netlify/functions"

# There is no blocklist any more, and that is the point.
#
# The publish root used to be the whole repository, with a redirect per file
# that had to stay out of it. That design failed in production. Netlify serves
# files case-insensitively but matches redirects case-sensitively, so every
# entry on the list could be walked around by changing one letter. On
# 19 September 2026 https://lukehammond.netlify.app/schools.JS returned the
# whole school file, ie, 100 KB holding ninety coach email addresses, every
# conference benchmark and Luke's recorded priority for all sixty-four
# programmes. /claude.md, /CLAUDE.MD and /Board.test.js served the same way.
# The file the old comment promised was "served to nobody" was served to anyone
# who pressed shift.
#
# Now only public/ is deployed. schools.js, the tests, the docs and the project
# notes sit outside it and cannot be reached by any spelling. A new file is
# private unless it is deliberately put in public/, which is the safe default,
# ie, forgetting to add something to a list can no longer leak it.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Nothing on this site needs a camera, a microphone or a location, so it
    # says so rather than leaving the question open.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # The honest version. 'unsafe-inline' is still needed because the page
    # carries inline style and script blocks, so this is not the full defence a
    # nonce would give. What it does do is name the only hosts that may serve
    # script, style, font or image to this site, so an injected tag pointing
    # somewhere else does not load. object-src and base-uri close the two
    # classic ways around that.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
