[build]
  publish = "."
  functions = "netlify/functions"

# The back end, the project's own notes, and the test file are not the website.
# The publish root is the whole folder, so anything not explicitly hidden is
# served to anyone who guesses the path.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/board.test.js"
  to = "/404.html"
  status = 404
  force = true

# schools.js carries seventeen coach email addresses, the conference
# benchmarks, and Luke's recorded priority for every programme. It is served
# to nobody. The admin screen gets that data from /api/schools, behind the key.
#
# This was briefly wrong and worth remembering. The file originally held no
# contacts, so leaving it public looked harmless and was. Then the contacts
# were added to it and the reasoning was never revisited, ie, the whole board
# was public on the first deploy. The pure functions the browser actually needs
# now live in school-utils.js, which holds no data at all.
[[redirects]]
  from = "/schools.js"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
